name: Dev-Workflow
on:
   workflow_dispatch:
     inputs:
        environment:
         description: 'Environment to run tests against' 
         type: environment 
         required: true
        version:
         description: 'Version Number'
         required: false
  
concurrency: dev

env:
  APP_IMAGE: ${{ secrets.APP_IMAGE }} 
  IMAGE_ID: ${{ secrets.AWS_ECR_URI_DEV }}
  IMAGE_NAME: fmdbtest
  TF_VERSION: 1.9.8
  TG_VERSION: 0.68.7
  TG_SRC_PATH: Terraform
  TFC_WORKSPACE: dev
  DESIGNATED_BRANCH: ${{ github.ref_name }}
  
permissions:
  id-token: write # This is required for requesting the JWT
  contents: read  # This is required for actions/checkout
  
jobs:
  docker_push:
    name: docker push
    environment:  dev
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3
        with: 
          ref: ${{ env.DESIGNATED_BRANCH }}
        
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.TERRAFORM_DEPLOY_ROLE_ARN_DEV }}
          aws-region: ca-central-1
          
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        
      - uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
            
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v2
        
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v4
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
          file: fmdb/Dockerfile
          push: true
          tags: ${{ env.IMAGE_ID }}:latest
          
  terraform_apply:
    name: terraform apply 
    environment: dev
    runs-on: ubuntu-22.04
    needs: docker_push
    steps:
    
      - name: Check out the repo
        uses: actions/checkout@v3
        with:
          ref: ${{ env.DESIGNATED_BRANCH }}
          
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.TERRAFORM_DEPLOY_ROLE_ARN_DEV }}
          aws-region: ca-central-1
          
      - uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
          
      - uses: autero1/action-terragrunt@v1.3.1
        with:
          terragrunt_version: ${{ env.TG_VERSION }}
            
      - name: Terragrunt Apply
        working-directory: ${{ env.TG_SRC_PATH }}/${{ env.TFC_WORKSPACE }}
        env:
          app_image: ${{ env.IMAGE_ID }}:${{ github.sha }}
          LICENSE_PLATE: ${{ secrets.MY_LICENSE_PLATE }}
        run: |
            echo "Repository variable : '${{ inputs.ENVIRONMENT }}' " 
            echo "Environment variable: '${{ github.event.inputs.environment }}' " 
            terragrunt run-all init -upgrade --terragrunt-non-interactive
            terragrunt run-all apply --terragrunt-non-interactive
