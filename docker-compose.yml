services:
  db:
    image: postgres:18-alpine
    container_name: ${DB_HOST}
    environment:
      - POSTGRES_PASSWORD=${PG_PASSWORD}
    ports:
      - 5432:5432
    volumes:
      - db_data:/var/lib/postgresql

  fmdb_application:
    image: fmdb:latest
    container_name: fmdb
    build:
      context: .
      dockerfile: fmdb/Dockerfile
      args:
        CA_ROOT: ${CA_ROOT}
    environment:
      - PROVIDER_URI=${PROVIDER_URI}
      - REDIRECT_URI=${REDIRECT_URI}
      - SITEMINDER_URI=${SITEMINDER_URI}
      - fmdb_keycloak_client_secret=${fmdb_keycloak_client_secret}
      - XMX_DEV=${XMX_DEV}
      - XMS_DEV=${XMS_DEV}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - PG_USER=${PG_USER}
      - PG_PASSWORD=${PG_PASSWORD}
    ports:
      - ${PORT}:8080
      - ${PAYARA_PORT}:4848
    depends_on:
      - db
volumes:
  db_data:
